name: Weekly GDACS Data Ingestion

on:
  schedule:
    - cron: '0 0 * * 0' 
  workflow_dispatch: 

jobs:
  update-dataset:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests scikit-learn

      - name: Run Ingestion and Preprocessing
        run: |
          python src/data/ingest_gdacs.py
          python src/data/preprocess.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          
          git add data/processed/regional_disaster_index.geojson
          git commit -m "Automated spatial index update" || exit 0
          git push
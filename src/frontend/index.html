<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Traveler</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <div id="sidebar">
        <div class="header-row">
            <h2>🌍 Safety Traveler</h2>
            
            <div class="lang-wrapper">
                <div id="lang-btn" class="emoji-marker" title="Change Language">🌐</div>
                <div id="lang-menu" class="hidden">
                    <div class="lang-option" data-lang="/en/en">🇬🇧 English</div>
                    <div class="lang-option" data-lang="/en/el">🇬🇷 Ελληνικά</div>
                    <div class="lang-option" data-lang="/en/es">🇪🇸 Español</div>
                    <div class="lang-option" data-lang="/en/fr">🇫🇷 Français</div>
                </div>
            </div>
        </div>
        
        <div id="google_translate_element" style="display: none;"></div>

        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search city or country..." />
        </div>

        <div class="filters">
            <select id="season-filter">
                <option value="">Current Season</option>
                <option value="Spring">Spring</option>
                <option value="Summer">Summer</option>
                <option value="Autumn">Autumn</option>
                <option value="Winter">Winter</option>
            </select>
        </div>

        <div id="info-panel">
            <p>Move around the map or search a destination to view regional disaster predictions and precautions.</p>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/app.js"></script>
    
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'en'}, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>

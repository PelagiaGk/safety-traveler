<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Traveler</title>

    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self' https: data: 'unsafe-inline' 'unsafe-eval'; 
        font-src 'self' https://fonts.gstatic.com; 
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com;
    ">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="src/frontend/style.css">
</head>
<body>
    <div id="loading-screen" class="loading-overlay">
        <div class="loading-content">
            <h1 class="loader-title">Safety Traveler</h1>
            <p class="loader-text">Data-driven safety predictions based on past documentations</p>
            <div class="spinner"></div>
        </div>
    </div>
    <div class="app-wrapper">
        <div id="map"></div>

        <div class="ui-layer">
            <div class="top-nav-bar">
                <div class="search-container">
                    <span class="search-icon glass">🔍</span>
                    <input type="text" id="searchInput" placeholder="Search...">
                    <select id="season-filter" class="season-dropdown" aria-label="Select Season to view predictive map">
                        <option value="">Current Season</option>
                        <option value="Spring">Spring</option>
                        <option value="Summer">Summer</option>
                        <option value="Autumn">Autumn</option>
                        <option value="Winter">Winter</option>
                    </select>
                </div>
        
                <div class="region-indicator">
                    <span class="pin-icon">📍</span> 
                    <span id="regionText">Scanning Area...</span>
                </div>
            </div>
        </div>
    </div>
</div>
    </div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="src/frontend/app.js"></script>
</body>
</html>

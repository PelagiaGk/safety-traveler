<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Safety Traveler</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
    <div id="sidebar">
        
        <div class="header-row">
            <h2>🌍 Safety Traveler</h2>
            <div class="language-emoji-btn" title="Translate Map">
                🌐
                <div id="google_translate_element"></div>
            </div>
        </div>
        
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search city or country..." />
        </div>

        <div class="filters">
            <select id="season-filter">
                <option value="">Current Season</option>
                <option value="Spring">Spring</option>
                <option value="Summer">Summer</option>
                <option value="Autumn">Autumn</option>
                <option value="Winter">Winter</option>
            </select>
        </div>

        <div id="info-panel">
            <p>Move around the map or search a destination to view regional disaster predictions and precautions.</p>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="/static/app.js"></script>
    
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement(
                {pageLanguage: 'en', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 
                'google_translate_element'
            );
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit&hl=en"></script>
</body>
</html>
